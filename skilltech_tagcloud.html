<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Tag Cloud</title>
  <style>
    .tag-cloud {
      width: 80%;
      margin: 40px auto;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .tag-cloud span {
      display: inline-block;
      margin: 10px;
      padding: 5px 10px;
      font-size: calc(12px + 1vw);
      font-weight: bold;
      color: white;
      border-radius: 5px;
    }

    /* Véletlenszerű színek */
    .tag1 { background: #007acc; }
    .tag2 { background: #ff9900; }
    .tag3 { background: #33cc33; }
    .tag4 { background: #ff3366; }
    .tag5 { background: #9933ff; }
    .tag6 { background: #00b3b3; }
  </style>
</head>
<body>

<div class="tag-cloud">
  <span class="tag1">sowtware</span>
  <span class="tag2">cloud</span>
  <span class="tag3">integration</span>
  <span class="tag4">IaC</span>
  <span class="tag5">.Net</span>
  <span class="tag6">Java</span>
  <span class="tag1">C++</span>
  <span class="tag2">BPMN</span>
  <span class="tag3">Databas</span>
  <span class="tag4">NoSQL</span>
  <span class="tag5">DevOps</span>
  <span class="tag6">React</span>
  <span class="tag1">Angular</span>
  <span class="tag2">Android</span>
  <span class="tag3">IoT</span>
</div>

</body>
</html>
